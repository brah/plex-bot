<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512"
     height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="bucket">
      <path d="M120 222 L392 222 L362 448 L150 448 Z"/>
    </clipPath>
    <!-- one popcorn piece: lumpy union of four puffs, outlined as a single shape -->
    <g id="pop">
      <g fill="#2B2D31">
        <circle cx="-17" cy="6" r="36"/>
        <circle cx="8" cy="-15" r="36"/>
        <circle cx="19" cy="11" r="34"/>
        <circle cx="-9" cy="-19" r="30"/>
      </g>
      <g fill="#FFF8E6">
        <circle cx="-17" cy="6" r="24"/>
        <circle cx="8" cy="-15" r="24"/>
        <circle cx="19" cy="11" r="22"/>
        <circle cx="-9" cy="-19" r="18"/>
      </g>
    </g>
    <!-- the same piece, buttered -->
    <g id="pop-butter">
      <use xlink:href="#pop"/>
      <g fill="#FFE39A">
        <circle cx="-17" cy="6" r="24"/>
        <circle cx="19" cy="11" r="22"/>
      </g>
      <g fill="#FFF8E6">
        <circle cx="8" cy="-15" r="24"/>
        <circle cx="-9" cy="-19" r="18"/>
      </g>
    </g>
    <!-- Kernel without a face: popcorn heap over the striped bucket (bottom centre 256,448) -->
    <g id="kernel">
      <use xlink:href="#pop-butter" transform="translate(150 196) rotate(-20)"/>
      <use xlink:href="#pop" transform="translate(362 196) rotate(150)"/>
      <use xlink:href="#pop" transform="translate(204 148) rotate(40)"/>
      <use xlink:href="#pop-butter" transform="translate(310 150) rotate(-60)"/>
      <use xlink:href="#pop" transform="translate(258 104) rotate(10)"/>
      <use xlink:href="#pop" transform="translate(218 200) rotate(100)"/>
      <use xlink:href="#pop-butter" transform="translate(298 202) rotate(-130)"/>
      <g clip-path="url(#bucket)">
        <rect x="100" y="210" width="320" height="260" fill="#FFF4DC"/>
        <g fill="#E5A00D">
          <path d="M120 222 L174.4 222 L192.4 448 L150 448 Z"/>
          <path d="M228.8 222 L283.2 222 L277.2 448 L234.8 448 Z"/>
          <path d="M337.6 222 L392 222 L362 448 L319.6 448 Z"/>
        </g>
        <path d="M366 222 L400 222 L370 448 L340 448 Z" fill="#2B2D31" opacity="0.12"/>
      </g>
      <path d="M120 222 L392 222 L362 448 L150 448 Z" fill="none" stroke="#2B2D31" stroke-width="15"
            stroke-linejoin="round"/>
      <rect x="104" y="206" width="304" height="38" rx="18" fill="#E5A00D" stroke="#2B2D31"
            stroke-width="15" stroke-linejoin="round"/>
      <path d="M128 218 L240 218" stroke="#F5C04A" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>
  <ellipse cx="240" cy="478" rx="170" ry="15" fill="#2B2D31" opacity="0.28" filter="url(#soft)"/>
  <path transform="translate(250 112) scale(0.8)" d="M0 -28 Q9 -9 28 0 Q9 9 0 28 Q-9 9 -28 0 Q-9 -9 0 -28 Z"
        fill="#F5C04A" stroke="#2B2D31" stroke-width="10" stroke-linejoin="round"/>
  <path transform="translate(470 96) scale(1.0)" d="M0 -28 Q9 -9 28 0 Q9 9 0 28 Q-9 9 -28 0 Q-9 -9 0 -28 Z"
        fill="#F5C04A" stroke="#2B2D31" stroke-width="10" stroke-linejoin="round"/>
  <path transform="translate(452 250) scale(0.7)" d="M0 -28 Q9 -9 28 0 Q9 9 0 28 Q-9 9 -28 0 Q-9 -9 0 -28 Z"
        fill="#F5C04A" stroke="#2B2D31" stroke-width="10" stroke-linejoin="round"/>
  <g transform="translate(196 470) scale(0.72) translate(-256 -448)">
    <!-- left arm cheering; the right one holds the trophy up -->
    <path d="M150 330 L76 292 L52 214" fill="none" stroke="#2B2D31" stroke-width="52"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M150 330 L76 292 L52 214" fill="none" stroke="#E5A00D" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M362 330 L436 292 L460 214" fill="none" stroke="#2B2D31" stroke-width="52"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M362 330 L436 292 L460 214" fill="none" stroke="#E5A00D" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <use xlink:href="#kernel"/>
    <ellipse cx="210" cy="310" rx="23" ry="29" fill="#2B2D31"/>
    <ellipse cx="302" cy="310" rx="23" ry="29" fill="#2B2D31"/>
    <circle cx="216" cy="295" r="9" fill="#FFFFFF"/>
    <circle cx="308" cy="295" r="9" fill="#FFFFFF"/>
    <ellipse cx="176" cy="356" rx="19" ry="11" fill="#F2836B" opacity="0.8"/>
    <ellipse cx="336" cy="356" rx="19" ry="11" fill="#F2836B" opacity="0.8"/>
    <path d="M222 350 Q256 404 290 350 Z" fill="#2B2D31" stroke="#2B2D31" stroke-width="10"
          stroke-linejoin="round"/>
    <path d="M238 374 Q256 362 274 374 Q256 390 238 374 Z" fill="#F2836B"/>
    <circle cx="52" cy="200" r="31" fill="#FFF4DC" stroke="#2B2D31" stroke-width="13"/>
    <!-- gold cup: handles, bowl, rim, stem and plinth -->
    <path d="M392 14 Q338 10 342 52 Q348 90 400 84" fill="none" stroke="#2B2D31" stroke-width="34"
          stroke-linecap="round"/>
    <path d="M392 14 Q338 10 342 52 Q348 90 400 84" fill="none" stroke="#E5A00D" stroke-width="14"
          stroke-linecap="round"/>
    <path d="M528 14 Q582 10 578 52 Q572 90 520 84" fill="none" stroke="#2B2D31" stroke-width="34"
          stroke-linecap="round"/>
    <path d="M528 14 Q582 10 578 52 Q572 90 520 84" fill="none" stroke="#E5A00D" stroke-width="14"
          stroke-linecap="round"/>
    <rect x="440" y="96" width="40" height="52" fill="#E5A00D" stroke="#2B2D31" stroke-width="14"
          stroke-linejoin="round"/>
    <path d="M384 -6 L536 -6 Q536 100 460 110 Q384 100 384 -6 Z" fill="#F5C04A" stroke="#2B2D31"
          stroke-width="15" stroke-linejoin="round"/>
    <path d="M406 10 Q408 66 438 90" fill="none" stroke="#FFE39A" stroke-width="10" stroke-linecap="round"/>
    <path d="M460 18 L469 38 L491 40 L474 54 L479 76 L460 64 L441 76 L446 54 L429 40 L451 38 Z"
          fill="#FFF8E6" stroke="#2B2D31" stroke-width="8" stroke-linejoin="round"/>
    <rect x="372" y="-26" width="176" height="30" rx="13" fill="#E5A00D" stroke="#2B2D31" stroke-width="14"/>
    <rect x="408" y="140" width="104" height="38" rx="10" fill="#E5A00D" stroke="#2B2D31" stroke-width="14"/>
    <circle cx="460" cy="196" r="31" fill="#FFF4DC" stroke="#2B2D31" stroke-width="13"/>
  </g>
</svg>
