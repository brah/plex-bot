<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512"
     height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="bucket">
      <path d="M120 222 L392 222 L362 448 L150 448 Z"/>
    </clipPath>
    <!-- one popcorn piece: lumpy union of four puffs, outlined as a single shape -->
    <g id="pop">
      <g fill="#2B2D31">
        <circle cx="-17" cy="6" r="36"/>
        <circle cx="8" cy="-15" r="36"/>
        <circle cx="19" cy="11" r="34"/>
        <circle cx="-9" cy="-19" r="30"/>
      </g>
      <g fill="#FFF8E6">
        <circle cx="-17" cy="6" r="24"/>
        <circle cx="8" cy="-15" r="24"/>
        <circle cx="19" cy="11" r="22"/>
        <circle cx="-9" cy="-19" r="18"/>
      </g>
    </g>
    <!-- the same piece, buttered -->
    <g id="pop-butter">
      <use xlink:href="#pop"/>
      <g fill="#FFE39A">
        <circle cx="-17" cy="6" r="24"/>
        <circle cx="19" cy="11" r="22"/>
      </g>
      <g fill="#FFF8E6">
        <circle cx="8" cy="-15" r="24"/>
        <circle cx="-9" cy="-19" r="18"/>
      </g>
    </g>
    <!-- Kernel without a face: popcorn heap over the striped bucket (bottom centre 256,448) -->
    <g id="kernel">
      <use xlink:href="#pop-butter" transform="translate(150 196) rotate(-20)"/>
      <use xlink:href="#pop" transform="translate(362 196) rotate(150)"/>
      <use xlink:href="#pop" transform="translate(204 148) rotate(40)"/>
      <use xlink:href="#pop-butter" transform="translate(310 150) rotate(-60)"/>
      <use xlink:href="#pop" transform="translate(258 104) rotate(10)"/>
      <use xlink:href="#pop" transform="translate(218 200) rotate(100)"/>
      <use xlink:href="#pop-butter" transform="translate(298 202) rotate(-130)"/>
      <g clip-path="url(#bucket)">
        <rect x="100" y="210" width="320" height="260" fill="#FFF4DC"/>
        <g fill="#E5A00D">
          <path d="M120 222 L174.4 222 L192.4 448 L150 448 Z"/>
          <path d="M228.8 222 L283.2 222 L277.2 448 L234.8 448 Z"/>
          <path d="M337.6 222 L392 222 L362 448 L319.6 448 Z"/>
        </g>
        <path d="M366 222 L400 222 L370 448 L340 448 Z" fill="#2B2D31" opacity="0.12"/>
      </g>
      <path d="M120 222 L392 222 L362 448 L150 448 Z" fill="none" stroke="#2B2D31" stroke-width="15"
            stroke-linejoin="round"/>
      <rect x="104" y="206" width="304" height="38" rx="18" fill="#E5A00D" stroke="#2B2D31"
            stroke-width="15" stroke-linejoin="round"/>
      <path d="M128 218 L240 218" stroke="#F5C04A" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>
  <ellipse cx="256" cy="490" rx="220" ry="15" fill="#2B2D31" opacity="0.28" filter="url(#soft)"/>
  <rect x="56" y="270" width="400" height="160" rx="46" fill="#D9644A" stroke="#2B2D31"
        stroke-width="13"/>
  <rect x="92" y="294" width="328" height="18" rx="9" fill="#EC8466"/>
  <g transform="translate(246 436) rotate(-5) scale(0.8) translate(-256 -448)">
    <use xlink:href="#kernel"/>
    <path d="M186 312 Q210 334 234 312" fill="none" stroke="#2B2D31" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M278 312 Q302 334 326 312" fill="none" stroke="#2B2D31" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="180" cy="354" rx="19" ry="11" fill="#F2836B" opacity="0.85"/>
    <ellipse cx="332" cy="354" rx="19" ry="11" fill="#F2836B" opacity="0.85"/>
    <ellipse cx="256" cy="366" rx="13" ry="11" fill="#2B2D31"/>
    <ellipse cx="256" cy="370" rx="7" ry="5" fill="#F2836B"/>
  </g>
  <rect x="96" y="460" width="26" height="28" rx="8" fill="#9A6531" stroke="#2B2D31" stroke-width="10"/>
  <rect x="390" y="460" width="26" height="28" rx="8" fill="#9A6531" stroke="#2B2D31"
        stroke-width="10"/>
  <rect x="78" y="406" width="356" height="62" rx="24" fill="#EC8466" stroke="#2B2D31"
        stroke-width="13"/>
  <rect x="24" y="340" width="94" height="136" rx="38" fill="#D9644A" stroke="#2B2D31"
        stroke-width="13"/>
  <rect x="394" y="340" width="94" height="136" rx="38" fill="#D9644A" stroke="#2B2D31"
        stroke-width="13"/>
  <rect x="42" y="358" width="18" height="84" rx="9" fill="#EC8466"/>
  <rect x="412" y="358" width="18" height="84" rx="9" fill="#EC8466"/>
  <circle cx="398" cy="134" r="32" fill="#FFFFFF" stroke="#2B2D31" stroke-width="11"/>
  <path d="M384.56 120.56 L411.44 120.56 L384.56 147.44 L411.44 147.44" fill="none" stroke="#2B2D31"
        stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="450" cy="80" r="25" fill="#FFFFFF" stroke="#2B2D31" stroke-width="11"/>
  <path d="M439.5 69.5 L460.5 69.5 L439.5 90.5 L460.5 90.5" fill="none" stroke="#2B2D31"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="486" cy="38" r="17" fill="#FFFFFF" stroke="#2B2D31" stroke-width="11"/>
  <path d="M478.86 30.86 L493.14 30.86 L478.86 45.14 L493.14 45.14" fill="none" stroke="#2B2D31"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
