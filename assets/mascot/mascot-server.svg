<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512"
     height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="soft" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="bucket">
      <path d="M120 222 L392 222 L362 448 L150 448 Z"/>
    </clipPath>
    <!-- one popcorn piece: lumpy union of four puffs, outlined as a single shape -->
    <g id="pop">
      <g fill="#2B2D31">
        <circle cx="-17" cy="6" r="36"/>
        <circle cx="8" cy="-15" r="36"/>
        <circle cx="19" cy="11" r="34"/>
        <circle cx="-9" cy="-19" r="30"/>
      </g>
      <g fill="#FFF8E6">
        <circle cx="-17" cy="6" r="24"/>
        <circle cx="8" cy="-15" r="24"/>
        <circle cx="19" cy="11" r="22"/>
        <circle cx="-9" cy="-19" r="18"/>
      </g>
    </g>
    <!-- the same piece, buttered -->
    <g id="pop-butter">
      <use xlink:href="#pop"/>
      <g fill="#FFE39A">
        <circle cx="-17" cy="6" r="24"/>
        <circle cx="19" cy="11" r="22"/>
      </g>
      <g fill="#FFF8E6">
        <circle cx="8" cy="-15" r="24"/>
        <circle cx="-9" cy="-19" r="18"/>
      </g>
    </g>
    <!-- Kernel without a face: popcorn heap over the striped bucket (bottom centre 256,448) -->
    <g id="kernel">
      <use xlink:href="#pop-butter" transform="translate(150 196) rotate(-20)"/>
      <use xlink:href="#pop" transform="translate(362 196) rotate(150)"/>
      <use xlink:href="#pop" transform="translate(204 148) rotate(40)"/>
      <use xlink:href="#pop-butter" transform="translate(310 150) rotate(-60)"/>
      <use xlink:href="#pop" transform="translate(258 104) rotate(10)"/>
      <use xlink:href="#pop" transform="translate(218 200) rotate(100)"/>
      <use xlink:href="#pop-butter" transform="translate(298 202) rotate(-130)"/>
      <g clip-path="url(#bucket)">
        <rect x="100" y="210" width="320" height="260" fill="#FFF4DC"/>
        <g fill="#E5A00D">
          <path d="M120 222 L174.4 222 L192.4 448 L150 448 Z"/>
          <path d="M228.8 222 L283.2 222 L277.2 448 L234.8 448 Z"/>
          <path d="M337.6 222 L392 222 L362 448 L319.6 448 Z"/>
        </g>
        <path d="M366 222 L400 222 L370 448 L340 448 Z" fill="#2B2D31" opacity="0.12"/>
      </g>
      <path d="M120 222 L392 222 L362 448 L150 448 Z" fill="none" stroke="#2B2D31" stroke-width="15"
            stroke-linejoin="round"/>
      <rect x="104" y="206" width="304" height="38" rx="18" fill="#E5A00D" stroke="#2B2D31"
            stroke-width="15" stroke-linejoin="round"/>
      <path d="M128 218 L240 218" stroke="#F5C04A" stroke-width="7" stroke-linecap="round"/>
    </g>
  </defs>
  <ellipse cx="290" cy="478" rx="200" ry="15" fill="#2B2D31" opacity="0.28" filter="url(#soft)"/>
  <rect x="318" y="150" width="164" height="310" rx="20" fill="#6E7788" stroke="#2B2D31"
        stroke-width="13"/>
  <rect x="338" y="176" width="124" height="74" rx="10" fill="#A3ACBA" stroke="#2B2D31"
        stroke-width="10"/>
  <rect x="354" y="206" width="44" height="14" rx="7" fill="#2B2D31" opacity="0.55"/>
  <circle cx="422" cy="213" r="13" fill="#3FDB78" stroke="#2B2D31" stroke-width="8"/>
  <circle cx="418" cy="209" r="4" fill="#FFFFFF" opacity="0.8"/>
  <rect x="338" y="270" width="124" height="74" rx="10" fill="#A3ACBA" stroke="#2B2D31"
        stroke-width="10"/>
  <rect x="354" y="300" width="44" height="14" rx="7" fill="#2B2D31" opacity="0.55"/>
  <circle cx="422" cy="307" r="13" fill="#3FDB78" stroke="#2B2D31" stroke-width="8"/>
  <circle cx="418" cy="303" r="4" fill="#FFFFFF" opacity="0.8"/>
  <rect x="338" y="364" width="124" height="74" rx="10" fill="#A3ACBA" stroke="#2B2D31"
        stroke-width="10"/>
  <rect x="354" y="394" width="44" height="14" rx="7" fill="#2B2D31" opacity="0.55"/>
  <circle cx="422" cy="401" r="13" fill="#3FDB78" stroke="#2B2D31" stroke-width="8"/>
  <circle cx="418" cy="397" r="4" fill="#FFFFFF" opacity="0.8"/>
  <rect x="336" y="452" width="26" height="22" rx="6" fill="#6E7788" stroke="#2B2D31" stroke-width="9"/>
  <rect x="438" y="452" width="26" height="22" rx="6" fill="#6E7788" stroke="#2B2D31" stroke-width="9"/>
  <g transform="translate(186 468) rotate(0) scale(0.8) translate(-256 -448)">
    <use xlink:href="#kernel"/>
    <path d="M186 318 Q210 290 234 318" fill="none" stroke="#2B2D31" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M278 318 Q302 290 326 318" fill="none" stroke="#2B2D31" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="180" cy="356" rx="19" ry="11" fill="#F2836B" opacity="0.85"/>
    <ellipse cx="332" cy="356" rx="19" ry="11" fill="#F2836B" opacity="0.85"/>
    <path d="M222 350 Q256 400 290 350 Z" fill="#2B2D31" stroke="#2B2D31" stroke-width="10"
          stroke-linejoin="round"/>
    <path d="M240 372 Q256 362 272 372 Q256 386 240 372 Z" fill="#F2836B"/>
    <path d="M372 330 L428 318 L442 290" fill="none" stroke="#2B2D31" stroke-width="52"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M372 330 L428 318 L442 290" fill="none" stroke="#E5A00D" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="442" cy="284" r="28" fill="#FFF4DC" stroke="#2B2D31" stroke-width="13"/>
  </g>
  <path d="M330 76 Q339 95 358 104 Q339 113 330 132 Q321 113 302 104 Q321 95 330 76 Z" fill="#F5C04A"
        stroke="#2B2D31" stroke-width="10" stroke-linejoin="round"/>
  <path d="M478 102 Q484 114 496 120 Q484 126 478 138 Q472 126 460 120 Q472 114 478 102 Z"
        fill="#F5C04A" stroke="#2B2D31" stroke-width="10" stroke-linejoin="round"/>
</svg>
