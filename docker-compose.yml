# Plex-Bot on its own. Already run Docker Compose? Copy the plexbot service into your own
# file instead; the README's Docker Compose section walks through it.
services:
  plexbot:
    # Pin a version with :1 or :1.0.0 instead of :latest. To build from a clone of the repo,
    # replace image: with build: .
    image: ghcr.io/brah/plex-bot:latest
    container_name: plexbot
    restart: unless-stopped
    # Settings: PLEXBOT_<SECTION>_<KEY> variables, copied from .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      # Container timezone (the bot also reads Tautulli's own TZ for display).
      TZ: ${TZ:-UTC}
    volumes:
      # The bot's state: map.json (user links), the media cache and plexbot.log.
      - plexbot-data:/data
      # Prefer a config file to .env? Uncomment; environment variables still win.
      # - ./config.json:/data/config.json:ro

    # Reaching Tautulli / qBittorrent / Sonarr / Radarr:
    #  - Both in this Docker network: use the service name, e.g. "tautulli:8181".
    #  - Tautulli native on the host: use the host's LAN IP, OR uncomment the
    #    mapping below and use "host.docker.internal:8181".
    #    ("localhost" inside the container is the container itself — it will NOT
    #     reach a service running on the host.)
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

volumes:
  plexbot-data:
