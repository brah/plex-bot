version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"

  # Workflow actions in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image in the Dockerfile. CI tests on whichever Python it names.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
