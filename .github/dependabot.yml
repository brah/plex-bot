version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"

  # Workflow actions in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image in the Dockerfile. On a minor-version bump, update CI's test matrix too.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
