version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"

  # Workflow actions in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image in the Dockerfile. Patch releases ship within the floating
  # python:3.x-slim tag, so PRs here are Python minor-version bumps — keep
  # the newest version in CI's test matrix in step when merging one.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
