name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & syntax smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.17.0"

      - name: Ruff lint
        run: ruff check .

      - name: Compile all sources (syntax smoke test)
        run: >-
          python -m compileall -q
          plexbot.py media_cache.py tautulli_wrapper.py utilities.py slash_commands.py plex_status.py plex_users.py media_details.py
          config errors cogs ui

  test:
    name: Unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported version, and the one the Docker image runs.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        # Installing the pinned requirements also verifies they resolve together
        # on the supported Python version.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q
