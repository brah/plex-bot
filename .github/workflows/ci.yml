name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # the Release workflow runs CI before publishing

# CI only reads the code.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & syntax smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==0.17.0"

      - name: Ruff lint
        run: ruff check .

      - name: Compile all sources (syntax smoke test)
        run: python -m compileall -q .

  image-python:
    name: Docker image's Python version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - id: read
        # From the Dockerfile, so a Dependabot bump of the base image is tested on its new Python.
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+).*/\1/p' Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Unit tests (Python ${{ matrix.python }})
    needs: image-python
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a failure on one version still shows the other's result
      matrix:
        # The oldest supported version, and the one the Docker image runs.
        python: ["3.12", "${{ needs.image-python.outputs.version }}"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        # Installing the pinned requirements also verifies they resolve together
        # on the supported Python version.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t plexbot .

      - name: Start it with placeholder settings
        # It loads every command module, then Discord rejects the token and the bot exits.
        run: |
          timeout 120 docker run --rm -e PLEXBOT_CORE_TOKEN=placeholder \
            -e PLEXBOT_TAUTULLI_IP=127.0.0.1:9 -e PLEXBOT_TAUTULLI_APIKEY=placeholder \
            plexbot > run.log 2>&1 || true
          cat run.log
          test "$(grep -c 'Loaded cog:' run.log)" -eq "$(find plexbot/cogs -name '[!_]*.py' | wc -l)"
